name: CI

on:
  pull_request:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.10.0

      - name: Install dependencies
        run: npm ci

      - name: Run full quality suite
        run: npm run check
