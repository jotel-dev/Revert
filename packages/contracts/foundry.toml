[profile.default]
src = "src"
out = "out"
libs = ["node_modules", "../../node_modules"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=../../node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/"
]

[fuzz]
runs = 256
